server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ============================================================
    # CRITICAL: index.html must NEVER be cached by the browser.
    # Without this, users see stale UI after every new deployment
    # because the browser serves the old index.html from cache,
    # which references the old (now-missing) JS/CSS bundle hashes.
    # ============================================================
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # service-worker.js must also not be cached
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # Static hashed assets — cache aggressively for 1 year.
    # CRA names these files with a content hash (e.g., main.a4d76b2.js),
    # so they are safe to cache indefinitely; a new deploy gives new filenames.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
